<!DOCTYPE html>
<html lang="en">
<head>

    <title>Mock Position</title>

    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="polyfill.js"></script>

    <link rel="stylesheet" href="leaflet.css">
    <script src="leaflet.js"></script>
    <script src="leaflet-providers.js"></script>
    <script src="search.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 1;
        }
        #search-container {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            background: white;
            padding: 4px 8px;
            border-radius: 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            align-items: center;
        }
        #address_input {
            border: none;
            outline: none;
            padding: 10px 12px;
            font-size: 16px;
            flex-grow: 1;
            background: transparent;
        }
        #search-button {
            background: transparent;
            border: none;
            padding: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        :root {
            --dark-mode-filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        @media (prefers-color-scheme: dark) {
            #search-container {
                background: #202124;
                color: white;
            }
            #address_input {
                color: white;
            }
            .map-tiles,
            .leaflet-layer,
            .leaflet-control-zoom-in,
            .leaflet-control-zoom-out {
                filter:var(--dark-mode-filter, none);
            }
            .leaflet-container {
                background: #000
            }
        }
    </style>
</head>
<body>

<div id="search-container">
    <input type="text" id="address_input" name="address_input"
           placeholder="Search address..." autocomplete="off">
    <button id="search-button" onclick="searchForAddress()">🔍</button>
</div>

<div id='map'></div>

<script src="init.js"></script>
</body>
</html>
